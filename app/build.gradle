plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'dev.local.ridecompact'
    compileSdk 37
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId 'dev.local.ridecompact'; minSdk 28; targetSdk 35; versionCode 7; versionName '0.4.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug; debuggable false } }
}
dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.4.10')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'org.jetbrains.compose.ui:ui:1.10.3'
    implementation 'org.jetbrains.compose.foundation:foundation:1.10.3'
    implementation 'org.jetbrains.compose.runtime:runtime:1.10.3'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.json:json:20240303'
}
